name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-lint:
    name: Frontend lint (eslint)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Run frontend lint
        run: make frontend-lint

  frontend-typecheck:
    name: Frontend type check (tsc)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Run frontend type check
        run: make frontend-typecheck

  frontend-test:
    name: Frontend tests (vitest + coverage)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Run frontend tests with coverage
        run: make frontend-test

  frontend-build:
    name: Frontend build (vite)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Build frontend
        run: make frontend-build

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Ruff check
        run: make lint

  typecheck:
    name: Type check (ty)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Ty check
        run: make typecheck

  test:
    name: Tests (pytest, ${{ matrix.slice.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        slice:
          - name: unit
          - name: integration-core
          - name: integration-bridge
          - name: e2e
    env:
      PYTHONFAULTHANDLER: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Run tests
        run: make test-${{ matrix.slice.name }}

  test-postgres:
    name: Tests (pytest, PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codex_lb
          POSTGRES_PASSWORD: codex_lb
          POSTGRES_DB: codex_lb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codex_lb -d codex_lb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CODEX_LB_TEST_DATABASE_URL: postgresql+asyncpg://codex_lb:codex_lb@127.0.0.1:5432/codex_lb
      PYTHONFAULTHANDLER: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Run tests
        run: make test-postgres

  migration-check:
    name: Migration check (alembic)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Validate migration policy and drift
        run: make migration-check

  migration-check-postgres:
    name: Migration check (alembic, PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codex_lb
          POSTGRES_PASSWORD: codex_lb
          POSTGRES_DB: codex_lb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codex_lb -d codex_lb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Validate migration policy and drift on PostgreSQL
        run: make migration-check-postgres

  package:
    name: Package (build)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build and verify package
        run: make package

  docker:
    name: Docker build, scan, and publish digest
    runs-on: ubuntu-24.04
    needs:
      - frontend-lint
      - frontend-typecheck
      - frontend-test
      - frontend-build
      - lint
      - typecheck
      - test
      - test-postgres
      - migration-check
      - migration-check-postgres
      - package
    permissions:
      actions: read
      contents: read
      packages: write
      security-events: write
    outputs:
      image: ${{ steps.candidate.outputs.image }}
      digest: ${{ steps.candidate.outputs.digest }}
      revision: ${{ steps.candidate.outputs.revision }}
    env:
      DOCKER_CACHE_SCOPE: codex-lb-runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build one linux/amd64 runtime image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: codex-lb:ci
          platforms: linux/amd64
          build-args: |
            VCS_REF=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }}

      - name: Scan Docker image with Trivy (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: codex-lb:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: trivy-results.sarif
          # Keep PR and main uploads in the same CI category so Code Scanning
          # can compare pull-request alerts against the default-branch baseline.
          category: .github/workflows/ci.yml:docker

      - name: Enforce critical-vulnerability gate before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: codex-lb:ci
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SHA tag and resolve immutable digest
        id: candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"
          IMAGE_TAG="${IMAGE_REPOSITORY}:sha-${GITHUB_SHA}"
          docker tag codex-lb:ci "${IMAGE_TAG}"
          docker push "${IMAGE_TAG}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE_TAG}" --format '{{.Digest}}')"
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Invalid registry digest: ${DIGEST}" >&2
            exit 1
          }
          IMAGE="${IMAGE_TAG%@*}"
          IMAGE="${IMAGE%:*}@${DIGEST}"
          {
            echo "image=${IMAGE}"
            echo "digest=${DIGEST}"
            echo "revision=${REVISION}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Deployable image"
            echo
            echo "- Digest: \`${IMAGE}\`"
            echo "- Revision: \`${REVISION}\`"
            echo "- Auxiliary SHA tag: \`${IMAGE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan the published digest with Trivy (SARIF)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.candidate.outputs.image }}
          format: sarif
          output: trivy-published-results.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: true

      - name: Enforce critical-vulnerability gate for the published digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.candidate.outputs.image }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Verify published digest metadata and readiness
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.candidate.outputs.image }}
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          set -euo pipefail
          SMOKE_CONTAINER="codex-lb-image-smoke"
          SMOKE_VOLUME="codex-lb-image-smoke-data"
          cleanup() {
            docker rm --force "${SMOKE_CONTAINER}" >/dev/null 2>&1 || true
            docker volume rm "${SMOKE_VOLUME}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker pull "${IMAGE}"
          docker image inspect "${IMAGE}" > image-inspect.json
          python3 - <<'PY'
          import json
          import os

          image = json.load(open("image-inspect.json", encoding="utf-8"))[0]
          config = image["Config"]
          assert image["Os"] == "linux", image["Os"]
          assert image["Architecture"] == "amd64", image["Architecture"]
          assert config["Labels"]["org.opencontainers.image.revision"] == os.environ["REVISION"]
          assert config["Entrypoint"] == ["/app/scripts/docker-entrypoint.sh"]
          PY
          docker volume create "${SMOKE_VOLUME}" >/dev/null
          docker run --detach --rm --name "${SMOKE_CONTAINER}" \
            --mount "type=volume,src=${SMOKE_VOLUME},dst=/var/lib/codex-lb" \
            --publish 127.0.0.1:2455:2455 \
            "${IMAGE}" >/dev/null
          for attempt in $(seq 1 90); do
            HEALTH="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "${SMOKE_CONTAINER}")"
            if [ "${HEALTH}" = "healthy" ] && curl --fail --silent --show-error http://127.0.0.1:2455/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs "${SMOKE_CONTAINER}" >&2 || true
          echo "Published image did not become ready" >&2
          exit 1

  helm-lint:
    name: Helm lint + template + kubeconform
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2

      - name: Install kubeconform
        run: |
          set -euo pipefail
          KUBECONFORM_VERSION="0.7.0"
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) ARCH="amd64" ;;
            aarch64) ARCH="arm64" ;;
          esac
          ASSET="kubeconform-${OS}-${ARCH}.tar.gz"
          BASE_URL="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}"
          curl -fsSLO "${BASE_URL}/CHECKSUMS"
          curl -fsSLO "${BASE_URL}/${ASSET}"
          grep "  ${ASSET}$" CHECKSUMS | sha256sum -c -
          tar xzf "${ASSET}" -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Helm lint + template + kubeconform
        run: make helm-check

  helm-smoke-kind:
    name: Helm smoke install (kind)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2

      - name: Install kind
        run: |
          set -euo pipefail
          KIND_VERSION="0.30.0"
          BASE_URL="https://github.com/kubernetes-sigs/kind/releases/download/v${KIND_VERSION}"
          curl -fsSLO "${BASE_URL}/kind-linux-amd64"
          curl -fsSLO "${BASE_URL}/kind-linux-amd64.sha256sum"
          sha256sum -c ./kind-linux-amd64.sha256sum
          chmod +x ./kind-linux-amd64
          sudo mv ./kind-linux-amd64 /usr/local/bin/kind

      - name: Helm smoke install
        run: make helm-smoke-kind

  ci-required:
    name: CI Required
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - frontend-lint
      - frontend-typecheck
      - frontend-test
      - frontend-build
      - lint
      - typecheck
      - test
      - test-postgres
      - migration-check
      - migration-check-postgres
      - package
      - docker
      - helm-lint
      - helm-smoke-kind

    steps:
      - name: Require every CI job to pass
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: details["result"]
              for name, details in sorted(needs.items())
              if details.get("result") not in {"success", "skipped"}
          }
          if failed:
              for name, result in failed.items():
                  print(f"{name}: {result}")
              sys.exit(1)
          print("all required CI jobs passed")
          PY
